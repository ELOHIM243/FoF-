
      - name: Configure Android v2 embedding
        working-directory: fof_app
        run: |
          set -euo pipefail

          test -f android/app/src/main/AndroidManifest.xml || {
            echo "Android introuvable."
            exit 1
          }

          # Supprimer les anciennes activités
          find android/app/src/main -name 'MainActivity.*' -delete

          mkdir -p android/app/src/main/kotlin/com/elohim243/fof

          cat > android/app/src/main/kotlin/com/elohim243/fof/MainActivity.kt <<'EOF'
          package com.elohim243.fof

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ANDROID = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID)
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          ns = "{" + ANDROID + "}"

          path = "android/app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          app = tree.getroot().find("application")

          if app is None:
              raise RuntimeError("Balise application introuvable")

          if app.get(ns + "name") == "io.flutter.app.FlutterApplication":
              app.set(ns + "name", "${applicationName}")

          for item in list(app.findall("meta-data")):
              if item.get(ns + "name") in (
                  "flutterEmbedding",
                  "io.flutter.app.android.SplashScreenUntilFirstFrame",
              ):
                  app.remove(item)

          ET.SubElement(app, "meta-data", {
              ns + "name": "flutterEmbedding",
              ns + "value": "2",
          })

          tree.write(path, encoding="utf-8", xml_declaration=True)

          # Vérification
          app = ET.parse(path).getroot().find("application")

          assert app is not None
          assert app.get(ns + "name") != "io.flutter.app.FlutterApplication"

          meta = [
              m for m in app.findall("meta-data")
              if m.get(ns + "name") == "flutterEmbedding"
          ]

          assert len(meta) == 1
          assert meta[0].get(ns + "value") == "2"

          print("VERIFICATION REUSSIE : Android v2")
          PY
