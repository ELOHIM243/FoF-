
name: Build FOF APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.elohim243 --project-name fof_app fof_app

      - name: Copy code and resources
        run: |
          cp -r lib pubspec.yaml l10n.yaml fof_app/
          for dir in assets fonts; do
            if [ -d "$dir" ]; then cp -r "$dir" fof_app/; fi
          done

      - name: Install dependencies
        working-directory: fof_app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Verify Android package
        working-directory: fof_app
        run: |
          grep -n "applicationId" android/app/build.gradle
          grep -n "namespace" android/app/build.gradle

      - name: Force Android SDK versions
        working-directory: fof_app/android/app
        run: |
          sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdkVersion 34/' build.gradle
          sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdkVersion 21/' build.gradle
          sed -i -E 's/targetSdk(Version)?[ =]+flutter\.targetSdkVersion/targetSdkVersion 34/' build.gradle
          grep -nE "compileSdk|minSdk|targetSdk" build.gradle

      - name: Build APK
        working-directory: fof_app
        run: flutter build apk --debug

      - name: Display SHA-1 fingerprint
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fof-apk
          path: fof_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
