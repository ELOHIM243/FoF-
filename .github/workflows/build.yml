name: Build FOF APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          
      - name: Create Flutter project and copy code
        run: |
          flutter create fof_app
          cp -r lib pubspec.yaml l10n.yaml fof_app/
          cd fof_app
          flutter pub get
          flutter gen-l10n
          
      - name: Fix Gradle Configuration and Build APK
        run: |
          cd fof_app/android
          
          # Injection de la configuration Flutter pour les plugins modernes
          sed -i '/ext.flutter =/d' build.gradle
          echo "ext.flutter = [compileSdkVersion: 34, minSdkVersion: 21, targetSdkVersion: 34]" >> build.gradle
          
          # Forcer les versions dans le module app
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' app/build.gradle
          
          cd ..
          flutter build apk --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fof-apk
          path: fof_app/build/app/outputs/flutter-apk/app-debug.apk