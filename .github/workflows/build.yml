name: Build FOF APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter project
        run: flutter create fof_app

      - name: Copy code and resources
        run: |
          cp -r lib pubspec.yaml l10n.yaml fof_app/
          # Copie les dossiers optionnels s'ils existent
          for dir in assets fonts; do
            if [ -d "$dir" ]; then cp -r "$dir" fof_app/; fi
          done

      - name: Install dependencies
        working-directory: fof_app
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Force Android SDK versions
        working-directory: fof_app/android/app
        run: |
          sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdkVersion 34/' build.gradle
          sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdkVersion 21/' build.gradle
          sed -i -E 's/targetSdk(Version)?[ =]+flutter\.targetSdkVersion/targetSdkVersion 34/' build.gradle
          echo "--- Vérification ---"
          grep -nE "compileSdk|minSdk|targetSdk" build.gradle

      - name: Build APK
        working-directory: fof_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fof-apk
          path: fof_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error