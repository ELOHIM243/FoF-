name: Build FOF APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          
      - name: Create Flutter project and copy code
        run: |
          flutter create fof_app
          cp -r lib pubspec.yaml l10n.yaml fof_app/
          cd fof_app
          flutter pub get
          flutter gen-l10n
          
      - name: Build APK
        run: |
          cd fof_app
          flutter build apk --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fof-apk
          path: fof_app/build/app/outputs/flutter-apk/app-debug.apk
